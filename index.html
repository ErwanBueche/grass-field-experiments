<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grass Field Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222244);

    // Camera that can actually see things
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 20);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---- A big visible square ground ----
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.MeshBasicMaterial({ color: 0x44aa44, side: THREE.DoubleSide })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.1;
    scene.add(ground);

    // ---- 50 colored test rectangles scattered around ----
    for (let i = 0; i < 50; i++) {
      const w = 0.5 + Math.random() * 0.5;
      const h = 1.0 + Math.random() * 1.5;
      const x = (Math.random() - 0.5) * 8;
      const z = (Math.random() - 0.5) * 8;
      const color = new THREE.Color().setHSL(Math.random(), 0.8, 0.5);

      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide })
      );
      mesh.position.set(x, h / 2, z);
      mesh.rotation.y = Math.random() * Math.PI * 2;
      scene.add(mesh);

      // Add a small sphere at the base for visibility
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xff0000 })
      );
      sphere.position.set(x, 0, z);
      scene.add(sphere);
    }

    // ---- Grid helper ----
    const grid = new THREE.GridHelper(10, 10, 0xffffff, 0x666666);
    scene.add(grid);

    // ---- Axes helper ----
    const axes = new THREE.AxesHelper(5);
    scene.add(axes);

    console.log('Scene ready:', scene.children.length, 'objects');

    function animate() {
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
