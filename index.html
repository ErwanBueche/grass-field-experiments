<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOTW Grass Field</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: fixed; top: 12px; left: 12px;
      font: 12px/1.6 Consolas, monospace;
      color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.3);
      padding: 8px 12px; border-radius: 6px;
      pointer-events: none; user-select: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="info"><span id="fps">--</span> FPS &middot; BOTW Grass</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
// ── Perlin Noise ──────────────────────────────────────────────
function PerlinNoise(seed) {
  const P = new Uint8Array(512);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  let s = seed;
  for (let i = 255; i > 0; i--) {
    s = (s * 16807) % 2147483647;
    const j = s % (i + 1);
    [p[i], p[j]] = [p[j], p[i]];
  }
  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + t * (b - a); }
  function grad(h, x, y) {
    const hh = h & 3;
    const u = hh < 2 ? x : y;
    const v = hh < 2 ? y : x;
    return ((hh & 1) === 0 ? u : -u) + ((hh & 2) === 0 ? v : -v);
  }
  this.n = function(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    return lerp(lerp(grad(P[P[X] + Y], xf, yf), grad(P[P[X] + 1 + Y], xf - 1, yf), u),
                lerp(grad(P[P[X] + Y + 1], xf, yf - 1), grad(P[P[X] + 1 + Y + 1], xf - 1, yf - 1), u), v);
  };
  // FBM: multiple octaves for richer detail
  this.fbm = function(x, y) {
    let val = 0, amp = 0.5, freq = 1;
    for (let i = 0; i < 3; i++) {
      val += amp * this.n(x * freq, y * freq);
      freq *= 2;
      amp *= 0.5;
    }
    return val; // [-1, 1]
  };
}

// ── BOTW-inspired grass color function ────────────────────────
function botwColor(nv) {
  // nv is Perlin noise value [-1, 1] at the blade's position
  // BOTW greens are DESATURATED: S ~20-30%, Hue 85-105
  const hue = 95 + nv * 8;          // 87-103  (warm greens)
  const sat = 0.25 + nv * 0.04;     // 0.21-0.29
  const lum = 0.38 + nv * 0.07;     // 0.31-0.45
  const hh = hue / 360, s = sat, l = lum;
  const cv = (1 - Math.abs(2 * l - 1)) * s;
  const xv = cv * (1 - Math.abs((hh * 6) % 2 - 1));
  const m = l - cv / 2;
  let r, g, b;
  if (hh < 1/6) { r = cv; g = xv; b = 0; }
  else if (hh < 2/6) { r = xv; g = cv; b = 0; }
  else if (hh < 3/6) { r = 0; g = cv; b = xv; }
  else if (hh < 4/6) { r = 0; g = xv; b = cv; }
  else if (hh < 5/6) { r = xv; g = 0; b = cv; }
  else { r = cv; g = 0; b = xv; }
  return [r + m, g + m, b + m];
}

// Color for the ground/tip of blade (slightly lighter)
function botwTipColor(nv) {
  const hue = 90 + nv * 8;
  const sat = 0.22 + nv * 0.04;
  const lum = 0.48 + nv * 0.06;
  const hh = hue / 360, s = sat, l = lum;
  const cv = (1 - Math.abs(2 * l - 1)) * s;
  const xv = cv * (1 - Math.abs((hh * 6) % 2 - 1));
  const m = l - cv / 2;
  let r, g, b;
  if (hh < 1/6) { r = cv; g = xv; b = 0; }
  else if (hh < 2/6) { r = xv; g = cv; b = 0; }
  else if (hh < 3/6) { r = 0; g = cv; b = xv; }
  else if (hh < 4/6) { r = 0; g = xv; b = cv; }
  else if (hh < 5/6) { r = xv; g = 0; b = cv; }
  else { r = cv; g = 0; b = xv; }
  return [r + m, g + m, b + m];
}

// ── Config ────────────────────────────────────────────────────
const BLADE_COUNT = 150000;
const FIELD_SIZE = 50;
const BLADE_HEIGHT = 0.85;

// ── Scene ────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7EC8E3);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 8, 25);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ── Build Ground with vertex colors ──────────────────────────
const noise = new PerlinNoise(137);
const GSEG = 32;
const groundGeo = new THREE.PlaneGeometry(FIELD_SIZE + 6, FIELD_SIZE + 6, GSEG, GSEG);
groundGeo.rotateX(-Math.PI / 2);
const gPos = groundGeo.attributes.position.array;
const gCol = new Float32Array(gPos.length);
for (let i = 0; i < gPos.length / 3; i++) {
  const x = gPos[i * 3], z = gPos[i * 3 + 2];
  const nv = noise.fbm(x * 0.06, z * 0.06);
  const [r, g, b] = botwColor(nv * 0.8); // ground is slightly darker
  gCol[i * 3] = r; gCol[i * 3 + 1] = g; gCol[i * 3 + 2] = b;
}
groundGeo.setAttribute('color', new THREE.BufferAttribute(gCol, 3));
const groundMat = new THREE.MeshBasicMaterial({ vertexColors: THREE.VertexColors, side: THREE.DoubleSide });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.position.y = -0.05;
scene.add(ground);

// ── Build Grass ──────────────────────────────────────────────
console.log('Building', BLADE_COUNT, 'blades...');

const baseW = 0.035, topW = 0.007;
const hb = baseW / 2, ht = topW / 2;
const V = 6, N = BLADE_COUNT * V;
const pos = new Float32Array(N * 3);
const col = new Float32Array(N * 3);
const to = [0, 1, 2, 0, 2, 3];

for (let i = 0; i < BLADE_COUNT; i++) {
  const x = (Math.random() - 0.5) * FIELD_SIZE;
  const z = (Math.random() - 0.5) * FIELD_SIZE;
  const yaw = Math.random() * Math.PI * 2;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const h = BLADE_HEIGHT * (0.6 + Math.random() * 0.8);

  // Sample ground color at this position using noise
  const nv = noise.fbm(x * 0.06, z * 0.06);
  const baseRGB = botwColor(nv);
  const tipRGB = botwTipColor(nv);

  const verts = [[-hb, 0], [hb, 0], [ht, h], [-ht, h]];
  const bi = i * V;
  for (let j = 0; j < 6; j++) {
    const vi = to[j], [lx, ly] = verts[vi];
    const wx = x + lx * cy, wz = z + lx * sy;
    const pi = (bi + j) * 3;
    pos[pi] = wx; pos[pi+1] = ly; pos[pi+2] = wz;
    // Base vertices (y=0) get ground color, tip vertices get lighter color
    const t = ly / h; // 0 at base, 1 at tip
    const rgb = t > 0.5 ? tipRGB : baseRGB;
    col[pi] = rgb[0]; col[pi+1] = rgb[1]; col[pi+2] = rgb[2];
  }
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
const mat = new THREE.MeshBasicMaterial({ vertexColors: THREE.VertexColors, side: THREE.DoubleSide });
const mesh = new THREE.Mesh(geo, mat);
mesh.frustumCulled = false;
scene.add(mesh);

console.log('Done:', BLADE_COUNT, 'blades');

// ── Fog ────────────────────────────────────────────────────────
scene.fog = new THREE.Fog(0x7EC8E3, 30, 75);

// ── Animation ──────────────────────────────────────────────────
const fpsEl = document.getElementById('fps');
let fc = 0, ft = 0, prev = performance.now();
function tick() {
  const now = performance.now(); ft += (now - prev) / 1000; prev = now;
  renderer.render(scene, camera); fc++;
  if (ft >= 1.0) { if (fpsEl) fpsEl.textContent = fc; fc = 0; ft = 0; }
  requestAnimationFrame(tick);
}
tick();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
  </script>
</body>
</html>
