<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOTW Grass Field</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: fixed; top: 12px; left: 12px;
      font: 12px/1.6 Consolas, monospace;
      color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.3);
      padding: 8px 12px; border-radius: 6px;
      pointer-events: none; user-select: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="info"><span id="fps">--</span> FPS &middot; BOTW Grass</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
// ── Config ────────────────────────────────────────────────────
const BLADE_COUNT = 150000;
const FIELD_SIZE = 50;
const BLADE_HEIGHT = 0.85;

// ── Perlin Noise ──────────────────────────────────────────────
function PerlinNoise(seed) {
  const perm = new Uint8Array(512);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  let s = seed;
  for (let i = 255; i > 0; i--) {
    s = (s * 16807) % 2147483647;
    const j = s % (i + 1);
    [p[i], p[j]] = [p[j], p[i]];
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + t * (b - a); }
  function grad(h, x, y) {
    const hh = h & 3;
    const u = hh < 2 ? x : y;
    const v = hh < 2 ? y : x;
    return ((hh & 1) === 0 ? u : -u) + ((hh & 2) === 0 ? v : -v);
  }
  this.noise = function(x, y) {
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x);
    const yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    const aa = perm[perm[X] + Y], ab = perm[perm[X] + Y + 1];
    const ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
    return lerp(lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u),
                lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u), v);
  };
}

// ── Scene Setup ────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7EC8E3);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 8, 25);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ── Ground ────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(FIELD_SIZE + 4, FIELD_SIZE + 4),
  new THREE.MeshBasicMaterial({ color: 0x3d6b35, side: THREE.DoubleSide })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
scene.add(ground);

// ── Build Grass ──────────────────────────────────────────────
console.log('Building', BLADE_COUNT, 'blades...');

const baseW = 0.035, topW = 0.007;
const hb = baseW / 2, ht = topW / 2;
const V = 6, N = BLADE_COUNT * V;
const pos = new Float32Array(N * 3);
const col = new Float32Array(N * 3);
const noise = new PerlinNoise(42);
const to = [0, 1, 2, 0, 2, 3];

for (let i = 0; i < BLADE_COUNT; i++) {
  const x = (Math.random() - 0.5) * FIELD_SIZE;
  const z = (Math.random() - 0.5) * FIELD_SIZE;
  const yaw = Math.random() * Math.PI * 2;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const h = BLADE_HEIGHT * (0.6 + Math.random() * 0.8);

  const nv = noise.noise(x * 0.08, z * 0.08);
  const hue = 115 + nv * 10 + Math.random() * 15;
  const sat = 0.55 + nv * 0.08 + Math.random() * 0.15;
  const lum = 0.35 + nv * 0.06 + Math.random() * 0.12;
  const hh = hue / 360, s = sat, l = lum;
  const cv = (1 - Math.abs(2 * l - 1)) * s;
  const xv = cv * (1 - Math.abs((hh * 6) % 2 - 1));
  const m = l - cv / 2;
  let r, g, bv;
  if (hh < 1/6) { r = cv; g = xv; bv = 0; }
  else if (hh < 2/6) { r = xv; g = cv; bv = 0; }
  else if (hh < 3/6) { r = 0; g = cv; bv = xv; }
  else if (hh < 4/6) { r = 0; g = xv; bv = cv; }
  else if (hh < 5/6) { r = xv; g = 0; bv = cv; }
  else { r = cv; g = 0; bv = xv; }
  const rgb = [r + m, g + m, bv + m];

  const verts = [[-hb, 0], [hb, 0], [ht, h], [-ht, h]];
  const bi = i * V;
  for (let j = 0; j < 6; j++) {
    const vi = to[j], [lx, ly] = verts[vi];
    const wx = x + lx * cy, wz = z + lx * sy;
    const pi = (bi + j) * 3;
    pos[pi] = wx; pos[pi+1] = ly; pos[pi+2] = wz;
    col[pi] = rgb[0]; col[pi+1] = rgb[1]; col[pi+2] = rgb[2];
  }
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

const mat = new THREE.MeshBasicMaterial({
  vertexColors: THREE.VertexColors,
  side: THREE.DoubleSide,
});

const mesh = new THREE.Mesh(geo, mat);
mesh.frustumCulled = false;
scene.add(mesh);

console.log('Done: 150k blades');

// ── Fog ────────────────────────────────────────────────────────
scene.fog = new THREE.Fog(0x7EC8E3, 30, 70);

// ── Animation ──────────────────────────────────────────────────
const fpsEl = document.getElementById('fps');
let fc = 0, ft = 0, prev = performance.now();

function tick() {
  const now = performance.now();
  ft += (now - prev) / 1000;
  prev = now;
  renderer.render(scene, camera);
  fc++;
  if (ft >= 1.0) { if (fpsEl) fpsEl.textContent = fc + ' FPS'; fc = 0; ft = 0; }
  requestAnimationFrame(tick);
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
  </script>
</body>
</html>
