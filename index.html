<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grass Field Experiments</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Info overlay */
    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 12px;
      border-radius: 6px;
      pointer-events: none;
      user-select: none;
      line-height: 1.6;
      z-index: 10;
    }
    #info .fps {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="info">
    <span class="fps">-- FPS</span> &middot; 5k debug blades
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
