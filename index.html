<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOTW Grass Field</title>
  <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden}canvas{display:block}#info{position:fixed;top:12px;left:12px;font:12px/1.6 Consolas,monospace;color:rgba(255,255,255,0.6);background:rgba(0,0,0,0.3);padding:8px 12px;border-radius:6px;pointer-events:none;user-select:none;z-index:10}</style>
</head>
<body>
<div id="info"><span id="fps">--</span> FPS &middot; BOTW Grass</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Perlin Noise ──────────────────────────────────────────────
function Perlin(seed) {
  const P=new Uint8Array(512),p=new Uint8Array(256);
  for(let i=0;i<256;i++)p[i]=i;
  let s=seed;
  for(let i=255;i>0;i--){s=(s*16807)%2147483647;const j=s%(i+1);[p[i],p[j]]=[p[j],p[i]]}
  for(let i=0;i<512;i++)P[i]=p[i&255];
  function f(t){return t*t*t*(t*(t*6-15)+10)}
  function l(a,b,t){return a+t*(b-a)}
  function g(h,x,y){const hh=h&3,u=hh<2?x:y,v=hh<2?y:x;return((hh&1)==0?u:-u)+((hh&2)==0?v:-v)}
  this.n=function(x,y){const X=Math.floor(x)&255,Y=Math.floor(y)&255,xf=x-Math.floor(x),yf=y-Math.floor(y),u=f(xf),v=f(yf);return l(l(g(P[P[X]+Y],xf,yf),g(P[P[X]+1+Y],xf-1,yf),u),l(g(P[P[X]+Y+1],xf,yf-1),g(P[P[X]+1+Y+1],xf-1,yf-1),u),v)}
}
function botwCol(nv){
  const hue=95+nv*8,sat=0.25+nv*0.04,lum=0.38+nv*0.07,hh=hue/360,s=sat,l=lum,cv=(1-Math.abs(2*l-1))*s,xv=cv*(1-Math.abs((hh*6)%2-1)),m=l-cv/2;
  if(hh<1/6)return [cv+m,xv+m,m]
  if(hh<2/6)return [xv+m,cv+m,m]
  if(hh<3/6)return [m,cv+m,xv+m]
  if(hh<4/6)return [m,xv+m,cv+m]
  if(hh<5/6)return [xv+m,m,cv+m]
  return [cv+m,m,xv+m]
}

// ── Config ────────────────────────────────────────────────────
const COUNT=50000,FIELD=50,HEIGHT=0.55,BW=0.06,TW=0.003;
const hb=BW/2,ht=TW/2,V=6,N=COUNT*V;

// ── Scene ────────────────────────────────────────────────────
const sc=new THREE.Scene();sc.background=new THREE.Color(0x7EC8E3);
const ca=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,500);
ca.position.set(0,8,25);ca.lookAt(0,0,0);
const re=new THREE.WebGLRenderer({antialias:true});
re.setPixelRatio(Math.min(devicePixelRatio,2));
re.setSize(innerWidth,innerHeight);document.body.appendChild(re.domElement);

// ── Ground ────────────────────────────────────────────────────
const gd=new THREE.Mesh(new THREE.PlaneGeometry(FIELD+6,FIELD+6),new THREE.MeshBasicMaterial({color:0x5a7a47,side:THREE.DoubleSide}));
gd.rotation.x=-Math.PI/2;gd.position.y=-0.05;sc.add(gd);

// ── Build Grass ──────────────────────────────────────────────
const noise=new Perlin(137);
const pos=new Float32Array(N*3);
const col=new Float32Array(N*3);
// Store original XZ for wind computation
const baseX=new Float32Array(N);
const baseZ=new Float32Array(N);
const hArr=new Float32Array(N);
const phaseArr=new Float32Array(N);
const to=[0,1,2,0,2,3];
let idx=0;

for(let i=0;i<COUNT;i++){
  const x=(Math.random()-0.5)*FIELD,z=(Math.random()-0.5)*FIELD;
  const yaw=Math.random()*Math.PI*2,cy=Math.cos(yaw),sy=Math.sin(yaw);
  const h=HEIGHT*(0.7+Math.random()*0.5);
  const nv=noise.n(x*0.08,z*0.08);
  const [r,g,b]=botwCol(nv);
  const phase=Math.random();
  const verts=[[-hb,0],[hb,0],[ht,h],[-ht,h]];
  for(let j=0;j<6;j++){
    const vi=to[j],[lx,ly]=verts[vi];
    const wx=x+lx*cy,wz=z+lx*sy;
    const pi=idx*3;
    pos[pi]=wx;pos[pi+1]=ly;pos[pi+2]=wz;
    col[pi]=r;col[pi+1]=g;col[pi+2]=b;
    baseX[idx]=wx;baseZ[idx]=wz;hArr[idx]=h;phaseArr[idx]=phase;
    idx++;
  }
}

const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(col,3));

// Store a copy of original positions for wind displacement
const origPos=new Float32Array(pos);

const mat=new THREE.MeshBasicMaterial({vertexColors:THREE.VertexColors,side:THREE.DoubleSide});
const mesh=new THREE.Mesh(geo,mat);
mesh.frustumCulled=false;
sc.add(mesh);

// ── Wind update on CPU ────────────────────────────────────────
let time=0;
function updateWind(dt){
  time+=dt;
  const t=time;
  for(let i=0;i<N;i++){
    const i3=i*3;
    const bx=baseX[i],bz=baseZ[i],ph=phaseArr[i],hh=hArr[i];
    const hNorm=hh/0.8;
    // Traveling gust
    const gust=Math.sin(t*1.3-bx*0.06-bz*0.03+ph*1.5)*0.5+0.5;
    const gust2=Math.sin(t*0.7-bx*0.02+bz*0.05+ph*2.3)*0.5+0.5;
    const gustE=gust*gust*0.7+gust2*gust2*0.3;
    const turb=Math.sin(t*2.1+bx*0.5+bz*0.4+ph*4.0)*0.12;
    const intensity=0.35*(0.6+0.4*Math.sin(t*0.2));
    const wind=(gustE+turb)*intensity*hNorm*hNorm;
    const dirVar=Math.sin(bx*0.03+bz*0.02+ph*2.0)*0.2;
    pos[i3]=origPos[i3]+wind*0.85;
    pos[i3+1]=origPos[i3+1];
    pos[i3+2]=origPos[i3+2]+wind*(0.15+dirVar);
  }
  geo.attributes.position.needsUpdate=true;
}

// ── Fog ────────────────────────────────────────────────────────
sc.fog=new THREE.Fog(0x7EC8E3,30,75);

// ── Loop ──────────────────────────────────────────────────────
const fpsEl=document.getElementById('fps');
let fc=0,ft=0,prev=performance.now();
function tick(){
  const now=performance.now(),dt=(now-prev)/1000;prev=now;
  updateWind(dt);
  re.render(sc,ca);fc++;ft+=dt;
  if(ft>=1.0){if(fpsEl)fpsEl.textContent=fc;fc=0;ft=0}
  requestAnimationFrame(tick)
}
tick();
addEventListener('resize',()=>{ca.aspect=innerWidth/innerHeight;ca.updateProjectionMatrix();re.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
