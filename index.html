<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOTW Grass Field</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: fixed; top: 12px; left: 12px;
      font: 12px/1.6 Consolas, monospace;
      color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.3);
      padding: 8px 12px; border-radius: 6px;
      pointer-events: none; user-select: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="info"><span id="fps">--</span> FPS &middot; BOTW Grass</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
// ── Perlin Noise ──────────────────────────────────────────────
function PerlinNoise(seed) {
  const perm = new Uint8Array(512);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  let s = seed;
  for (let i = 255; i > 0; i--) {
    s = (s * 16807 + 0) % 2147483647;
    const j = s % (i + 1);
    [p[i], p[j]] = [p[j], p[i]];
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + t * (b - a); }
  function grad(hash, x, y) {
    const h = hash & 3;
    const u = h < 2 ? x : y;
    const v = h < 2 ? y : x;
    return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
  }
  this.noise = function(x, y) {
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x);
    const yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    const aa = perm[perm[X] + Y], ab = perm[perm[X] + Y + 1];
    const ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
    return lerp(lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u),
                lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u), v);
  };
}

// ── Config ────────────────────────────────────────────────────
const BLADE_COUNT = 200000;
const FIELD_SIZE = 50;
const BLADE_HEIGHT = 0.85;

// ── Three.js Setup ────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7EC8E3);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 8, 20);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ── Lighting ──────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x7799CC, 0.5));
const sun = new THREE.DirectionalLight(0xFFEECC, 1.1);
sun.position.set(30, 40, 20);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88DDFF, 0.3);
fill.position.set(-15, 25, -25);
scene.add(fill);

// ── Ground ────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(FIELD_SIZE + 6, FIELD_SIZE + 6),
  new THREE.MeshLambertMaterial({ color: 0x3d6b35, side: THREE.DoubleSide })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
scene.add(ground);

// ── Build Grass Geometry ──────────────────────────────────────
console.log('Building', BLADE_COUNT, 'blades...');

const baseW = 0.03, topW = 0.006;
const halfBase = baseW / 2, halfTop = topW / 2;
const V = 6; // verts per blade
const totalVerts = BLADE_COUNT * V;
const posArr = new Float32Array(totalVerts * 3);
const colArr = new Float32Array(totalVerts * 3);
const windArr = new Float32Array(totalVerts);
const normArr = new Float32Array(totalVerts * 3);

const noise = new PerlinNoise(42);
const triOrder = [0, 1, 2, 0, 2, 3];

// Normals for Lambert shading: blade faces perpendicular to width direction
// In local XY plane, normal is (0, 0, 1). After Y-rotation by yaw: (sin(yaw), 0, cos(yaw))

for (let i = 0; i < BLADE_COUNT; i++) {
  const x = (Math.random() - 0.5) * FIELD_SIZE;
  const z = (Math.random() - 0.5) * FIELD_SIZE;
  const yaw = Math.random() * Math.PI * 2;
  const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
  const h = BLADE_HEIGHT * (0.6 + Math.random() * 0.8);

  // Perlin noise color
  const n = noise.noise(x * 0.08, z * 0.08);
  const hue = 115 + n * 10 + Math.random() * 15;
  const sat = 0.55 + n * 0.08 + Math.random() * 0.15;
  const lum = 0.35 + n * 0.06 + Math.random() * 0.12;
  const hh = hue / 360, ss = sat, ll = lum;
  const cv = (1 - Math.abs(2 * ll - 1)) * ss;
  const xv = cv * (1 - Math.abs((hh * 6) % 2 - 1));
  const m = ll - cv / 2;
  let r, g, b;
  if (hh < 1/6) { r = cv; g = xv; b = 0; }
  else if (hh < 2/6) { r = xv; g = cv; b = 0; }
  else if (hh < 3/6) { r = 0; g = cv; b = xv; }
  else if (hh < 4/6) { r = 0; g = xv; b = cv; }
  else if (hh < 5/6) { r = xv; g = 0; b = cv; }
  else { r = cv; g = 0; b = xv; }
  const cols = [r + m, g + m, b + m];
  const windPhase = Math.random();

  // 4 local corners: BL, BR, TR, TL
  const verts = [[-halfBase, 0], [halfBase, 0], [halfTop, h], [-halfTop, h]];
  const base = i * V;
  const nx = sinY, ny = 0, nz = cosY;

  for (let j = 0; j < 6; j++) {
    const vi = triOrder[j];
    const [lx, ly] = verts[vi];
    const wx = x + lx * cosY;
    const wz = z + lx * sinY;
    const pIdx = (base + j) * 3;
    posArr[pIdx]     = wx;
    posArr[pIdx + 1] = ly;
    posArr[pIdx + 2] = wz;
    colArr[pIdx]     = cols[0];
    colArr[pIdx + 1] = cols[1];
    colArr[pIdx + 2] = cols[2];
    normArr[pIdx]     = nx;
    normArr[pIdx + 1] = ny;
    normArr[pIdx + 2] = nz;
    windArr[base + j] = windPhase;
  }
}

// ── Create Geometry + Lambert Material ────────────────────────
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
geometry.setAttribute('normal', new THREE.BufferAttribute(normArr, 3));
geometry.setAttribute('windPhase', new THREE.BufferAttribute(windArr, 1));

const material = new THREE.MeshLambertMaterial({
  vertexColors: THREE.VertexColors,
  side: THREE.DoubleSide,
});

// ── Inject wind via onBeforeCompile ────────────────────────────
material.onBeforeCompile = function(shader) {
  shader.uniforms.uTime = { value: 0 };
  shader.uniforms.uWindStrength = { value: 0.35 };
  shaderTimeUniform = shader.uniforms.uTime;

  shader.vertexShader = 'attribute float windPhase;\n' + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace(
    '#include <begin_vertex>',
    `
    #include <begin_vertex>
    float windH = clamp(transformed.y / 1.2, 0.0, 1.0);
    float wind1 = sin(uTime * 1.4 + position.x * 0.08 + position.z * 0.05 + windPhase * 6.2832);
    float wind2 = sin(uTime * 1.0 + position.x * 0.25 + position.z * 0.15 + windPhase * 12.566);
    float wind = (wind1 * 0.7 + wind2 * 0.3) * uWindStrength * windH * windH;
    transformed.x += wind * 0.7;
    transformed.z += wind * 0.3;
    `
  );
};

const grassMesh = new THREE.Mesh(geometry, material);
grassMesh.frustumCulled = false;
scene.add(grassMesh);

console.log('Done:', BLADE_COUNT, 'blades');

// ── Fog ────────────────────────────────────────────────────────
scene.fog = new THREE.Fog(0x7EC8E3, 25, 65);

// ── Animation ──────────────────────────────────────────────────
const fpsEl = document.getElementById('fps');
let fc = 0, ft = 0, prev = performance.now();

function animate() {
  const now = performance.now();
  const dt = (now - prev) / 1000;
  prev = now;

  if (shaderTimeUniform) shaderTimeUniform.value += dt;

  renderer.render(scene, camera);

  fc++; ft += dt;
  if (ft >= 1.0) {
    if (fpsEl) fpsEl.textContent = fc;
    fc = 0; ft = 0;
  }
  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
  </script>
</body>
</html>
