<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOTW Grass Field</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: fixed; top: 12px; left: 12px;
      font: 12px/1.6 Consolas, monospace;
      color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.3);
      padding: 8px 12px; border-radius: 6px;
      pointer-events: none; user-select: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="info"><span id="fps">--</span> FPS &middot; BOTW Grass</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
// ── Perlin Noise ──────────────────────────────────────────────
// Simple 2D Perlin noise for natural grass color variation
function PerlinNoise(seed) {
  const perm = new Uint8Array(512);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  // Shuffle with seed
  let s = seed;
  for (let i = 255; i > 0; i--) {
    s = (s * 16807 + 0) % 2147483647;
    const j = s % (i + 1);
    [p[i], p[j]] = [p[j], p[i]];
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + t * (b - a); }
  function grad(hash, x, y) {
    const h = hash & 3;
    const u = h < 2 ? x : y;
    const v = h < 2 ? y : x;
    return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
  }

  this.noise = function(x, y) {
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x);
    const yf = y - Math.floor(y);
    const u = fade(xf);
    const v = fade(yf);
    const aa = perm[perm[X] + Y];
    const ab = perm[perm[X] + Y + 1];
    const ba = perm[perm[X + 1] + Y];
    const bb = perm[perm[X + 1] + Y + 1];
    return lerp(
      lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u),
      lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u),
      v
    );
  };
}

// ── Config ────────────────────────────────────────────────────
const BLADE_COUNT = 200000;
const FIELD_SIZE = 50;
const BLADE_HEIGHT = 0.85;

// ── Three.js Setup ────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7EC8E3);

// Camera: closer, less inclined angle
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 8, 20);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ── Lighting (soft BOTW-style) ────────────────────────────────
const ambient = new THREE.AmbientLight(0x7799CC, 0.5);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xFFEECC, 1.1);
sun.position.set(30, 40, 20);
scene.add(sun);

const fill = new THREE.DirectionalLight(0x88DDFF, 0.3);
fill.position.set(-15, 25, -25);
scene.add(fill);

// ── Ground ────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(FIELD_SIZE + 6, FIELD_SIZE + 6),
  new THREE.MeshStandardMaterial({
    color: 0x3d6b35,
    roughness: 1,
    metalness: 0,
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
scene.add(ground);

// ── Build Grass Geometry ──────────────────────────────────────
console.log('Building', BLADE_COUNT, 'blades...');

const baseW = 0.03;
const topW = 0.006;
const halfBase = baseW / 2;
const halfTop = topW / 2;

const vertsPerBlade = 6;
const totalVerts = BLADE_COUNT * vertsPerBlade;

const posArr = new Float32Array(totalVerts * 3);
const colArr = new Float32Array(totalVerts * 3);
const windArr = new Float32Array(totalVerts);  // wind phase per vertex
const noise = new PerlinNoise(42);
const triOrder = [0, 1, 2, 0, 2, 3];

// Loop for speed: 200k iterations
for (let i = 0; i < BLADE_COUNT; i++) {
  const x = (Math.random() - 0.5) * FIELD_SIZE;
  const z = (Math.random() - 0.5) * FIELD_SIZE;
  const yaw = Math.random() * Math.PI * 2;
  const cosY = Math.cos(yaw);
  const sinY = Math.sin(yaw);
  const h = BLADE_HEIGHT * (0.6 + Math.random() * 0.8);

  // Perlin noise for natural color patches
  const n = noise.noise(x * 0.08, z * 0.08); // [-1, 1]
  const hue = 115 + n * 10 + Math.random() * 15;     // ~105-140
  const sat = 0.55 + n * 0.08 + Math.random() * 0.15; // 0.5-0.78
  const lum = 0.35 + n * 0.06 + Math.random() * 0.12; // 0.3-0.53
  const hh = hue / 360;
  const ss = sat;
  const ll = lum;
  const cv = (1 - Math.abs(2 * ll - 1)) * ss;
  const xv = cv * (1 - Math.abs((hh * 6) % 2 - 1));
  const m = ll - cv / 2;
  let r, g, b;
  if (hh < 1/6) { r = cv; g = xv; b = 0; }
  else if (hh < 2/6) { r = xv; g = cv; b = 0; }
  else if (hh < 3/6) { r = 0; g = cv; b = xv; }
  else if (hh < 4/6) { r = 0; g = xv; b = cv; }
  else if (hh < 5/6) { r = xv; g = 0; b = cv; }
  else { r = cv; g = 0; b = xv; }

  const cols = [r + m, g + m, b + m];
  const windPhase = Math.random();

  // 4 local corners
  const verts = [[-halfBase, 0], [halfBase, 0], [halfTop, h], [-halfTop, h]];
  const base = i * vertsPerBlade;

  for (let j = 0; j < 6; j++) {
    const vi = triOrder[j];
    const [lx, ly] = verts[vi];
    const wx = x + lx * cosY;
    const wz = z + lx * sinY;
    const pIdx = (base + j) * 3;
    posArr[pIdx]     = wx;
    posArr[pIdx + 1] = ly;
    posArr[pIdx + 2] = wz;
    colArr[pIdx]     = cols[0];
    colArr[pIdx + 1] = cols[1];
    colArr[pIdx + 2] = cols[2];
    windArr[base + j] = windPhase;
  }
}

// ── Vertex Shader (BOTW-style wind) ────────────────────────────
const vertexShader = `
  attribute float aWindPhase;
  uniform float uTime;
  uniform float uWindStrength;
  uniform float uMaxBladeHeight;

  varying vec3 vColor;
  varying float vHeight;

  void main() {
    vec3 pos = position;
    float h = pos.y / uMaxBladeHeight; // normalized 0-1, clamped

    // BOTW-style wind: sine waves that travel across the field
    // Low frequency waves = gentle swaying
    float speed = 1.4;
    float waveFreq = 0.08; // wide waves
    float detailFreq = 0.25;

    // Main wind wave (primary direction X)
    float wind1 = sin(uTime * speed + pos.x * waveFreq + pos.z * waveFreq * 0.6 + aWindPhase * 6.2832);
    // Secondary wave for natural variation
    float wind2 = sin(uTime * speed * 0.7 + pos.x * detailFreq + pos.z * detailFreq * 0.4 + aWindPhase * 12.566);

    float windStrength = (wind1 * 0.7 + wind2 * 0.3) * uWindStrength * h * h;

    // BOTW wind bends blades mainly in X direction with slight Z component
    pos.x += windStrength * 0.7;
    pos.z += windStrength * 0.3;

    vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
    gl_Position = projectionMatrix * mvPos;

    vColor = color;
    vHeight = clamp(h, 0.0, 1.0);
  }
`;

// ── Fragment Shader (stylized lighting, no shadows on grass) ───
const fragmentShader = `
  varying vec3 vColor;
  varying float vHeight;

  void main() {
    // BOTW-style tip gradient: darker at base, lighter/yellower at tip
    vec3 baseCol = vColor * 0.55;
    vec3 tipCol = vec3(
      min(vColor.r * 1.6, 1.0),
      min(vColor.g * 1.35, 1.0),
      max(vColor.b * 0.75, 0.0)
    );
    vec3 bladeColor = mix(baseCol, tipCol, pow(vHeight, 1.4));

    // Soft stylized lighting (no self-shadows)
    vec3 lightDir = normalize(vec3(0.35, 0.7, 0.25));
    float NdotL = max(dot(vec3(0.0, 0.0, 1.0), lightDir), 0.0);
    float ambient = 0.35;
    float lighting = ambient + (1.0 - ambient) * NdotL;

    // Subtle subsurface glow (backlit)
    float back = max(dot(vec3(0.0, 0.0, -1.0), lightDir), 0.0) * 0.12 * vHeight;
    lighting += back;

    gl_FragColor = vec4(bladeColor * lighting, 1.0);
  }
`;

// ── Create Mesh ────────────────────────────────────────────────
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
geometry.setAttribute('aWindPhase', new THREE.BufferAttribute(windArr, 1));

const material = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uWindStrength: { value: 0.35 },
    uMaxBladeHeight: { value: BLADE_HEIGHT * 1.4 }, // max possible blade height
  },
  vertexShader,
  fragmentShader,
  side: THREE.DoubleSide,
});

const grassMesh = new THREE.Mesh(geometry, material);
grassMesh.frustumCulled = false;
scene.add(grassMesh);

console.log('Done:', BLADE_COUNT, 'blades');

// ── Fog ────────────────────────────────────────────────────────
scene.fog = new THREE.Fog(0x7EC8E3, 25, 65);

// ── Animation Loop ──────────────────────────────────────────────
const fpsEl = document.getElementById('fps');
let fc = 0, ft = 0, prev = performance.now();

function animate() {
  const now = performance.now();
  const dt = (now - prev) / 1000;
  prev = now;

  material.uniforms.uTime.value += dt;

  renderer.render(scene, camera);

  fc++;
  ft += dt;
  if (ft >= 1.0) {
    if (fpsEl) fpsEl.textContent = fc;
    fc = 0;
    ft = 0;
  }

  requestAnimationFrame(animate);
}

animate();

// ── Resize ──────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
  </script>
</body>
</html>
