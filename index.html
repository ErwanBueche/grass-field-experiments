<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grass Field</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #info {
      position: fixed; top: 12px; left: 12px;
      font: 12px/1.6 Consolas, monospace;
      color: rgba(255,255,255,0.55);
      background: rgba(0,0,0,0.35);
      padding: 8px 12px; border-radius: 6px;
      pointer-events: none; user-select: none; z-index: 10;
    }
    #info .fps { font-weight: bold; }
  </style>
</head>
<body>

  <div id="info">
    <span class="fps">-- FPS</span> &middot; Grass Field
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ============================================================
    //  GRASS FIELD — Single file, no modules, no importmap
    // ============================================================

    // ---- Config ----
    const BLADE_COUNT = 5000;
    const FIELD_SIZE = 50;
    const BLADE_HEIGHT = 1.0;

    // ---- Scene ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    // ---- Camera (orthographic top-down) ----
    const camera = new THREE.OrthographicCamera(-35, 35, 35, -35, 0.1, 200);
    camera.position.set(0, 100, 0.1);
    camera.lookAt(0, 0, 0);

    // ---- Renderer ----
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---- Square ground ----
    const groundGeo = new THREE.PlaneGeometry(FIELD_SIZE + 2, FIELD_SIZE + 2);
    groundGeo.rotateX(-Math.PI / 2);
    const groundMat = new THREE.MeshBasicMaterial({
      color: 0x3a6b35,
      side: THREE.DoubleSide,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.y = -0.05;
    scene.add(ground);

    // ---- Grass geometry ----
    console.log('Building grass geometry...');

    const baseWidth = 0.15;
    const topWidth = 0.05;
    const halfBase = baseWidth / 2;
    const halfTop = topWidth / 2;

    const totalVerts = BLADE_COUNT * 6;
    const positions = new Float32Array(totalVerts * 3);
    const colors = new Float32Array(totalVerts * 3);

    // 4 greens for variation
    const palette = [
      [0.2, 0.6, 0.2],
      [0.3, 0.7, 0.2],
      [0.4, 0.8, 0.1],
      [0.2, 0.5, 0.3],
    ];

    // Triangle vertex order: BL, BR, TR, BL, TR, TL
    const triOrder = [0, 1, 2, 0, 2, 3];

    for (let i = 0; i < BLADE_COUNT; i++) {
      const x = (Math.random() - 0.5) * FIELD_SIZE;
      const z = (Math.random() - 0.5) * FIELD_SIZE;
      const yaw = Math.random() * Math.PI * 2;
      const cosY = Math.cos(yaw);
      const sinY = Math.sin(yaw);
      const h = BLADE_HEIGHT * (0.7 + Math.random() * 0.6);

      // 4 local corners: BL, BR, TR, TL
      const verts = [
        [-halfBase, 0.0],
        [ halfBase, 0.0],
        [ halfTop,  h],
        [-halfTop,  h],
      ];

      const [r, g, b] = palette[i % 4];
      const base = i * 6 * 3;

      for (let j = 0; j < 6; j++) {
        const vi = triOrder[j];
        const [lx, ly] = verts[vi];
        const wx = x + lx * cosY;
        const wz = z + lx * sinY;

        const idx = base + j * 3;
        positions[idx]     = wx;
        positions[idx + 1] = ly;
        positions[idx + 2] = wz;

        colors[idx]     = r;
        colors[idx + 1] = g;
        colors[idx + 2] = b;
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.MeshBasicMaterial({
      vertexColors: THREE.VertexColors,
      side: THREE.DoubleSide,
    });

    const grassMesh = new THREE.Mesh(geometry, material);
    grassMesh.frustumCulled = false;
    scene.add(grassMesh);

    console.log('Added grass mesh:', BLADE_COUNT, 'blades');

    // ---- Animation ----
    const fpsEl = document.querySelector('#info .fps');
    let fpsCount = 0;
    let fpsTime = 0;
    let lastTime = performance.now();

    function animate() {
      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      renderer.render(scene, camera);

      fpsCount++;
      fpsTime += delta;
      if (fpsTime >= 1.0) {
        if (fpsEl) fpsEl.textContent = fpsCount + ' FPS';
        fpsCount = 0;
        fpsTime = 0;
      }

      requestAnimationFrame(animate);
    }

    animate();

    // ---- Resize ----
    window.addEventListener('resize', function() {
      const aspect = window.innerWidth / window.innerHeight;
      const vs = 35;
      if (aspect > 1) {
        camera.left = -vs * aspect;
        camera.right = vs * aspect;
        camera.top = vs;
        camera.bottom = -vs;
      } else {
        camera.left = -vs;
        camera.right = vs;
        camera.top = vs / aspect;
        camera.bottom = -vs / aspect;
      }
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
